version: '3.8'

services:
  # Neo4j Knowledge Graph (Rule 3)
  neo4j:
    image: neo4j:5.9.0
    container_name: trinetra_neo4j
    environment:
      - NEO4J_AUTH=neo4j/test1234
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    networks:
      - trinetra_airgap_net
    restart: unless-stopped

  # Backend FastAPI Engine (Rules 1, 2, 4)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinetra_backend
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test1234
    ports:
      - "8000:8000"
    volumes:
      # Map the SQLite staging database persistently
      - ./backend/staging.db:/app/staging.db
    depends_on:
      - neo4j
    networks:
      - trinetra_airgap_net
    restart: unless-stopped

  # Frontend React Dashboard (Rule 5)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trinetra_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - trinetra_airgap_net
    restart: unless-stopped

networks:
  # Isolated bridge network for internal microservice communication
  trinetra_airgap_net:
    driver: bridge

volumes:
  neo4j_data:
